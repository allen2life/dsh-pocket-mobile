name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  release:
    types: [ published, created ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Add Android Platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Patch Android Native Config & Injector
        run: |
          # 1. Copy Network Security Config
          mkdir -p android/app/src/main/res/xml
          cp android-res/xml/network_security_config.xml android/app/src/main/res/xml/

          # 2. Patch AndroidManifest.xml for cleartext traffic and camera permissions
          sed -i 's/<application/<application android:usesCleartextTraffic="true" android:networkSecurityConfig="@xml\/network_security_config"/' android/app/src/main/AndroidManifest.xml

          # 3. Copy customized MainActivity.java with theme injector & back navigation
          cp android-res/MainActivity.java android/app/src/main/java/com/deepseek/dshpocket/MainActivity.java

          # 4. Copy injector assets to Android assets
          mkdir -p android/app/src/main/assets/public/src/injector
          cp src/injector/* android/app/src/main/assets/public/src/injector/

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../DeepSeek-Pocket-v1.0.0.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Pocket-APK
          path: DeepSeek-Pocket-v1.0.0.apk

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: DeepSeek-Pocket-v1.0.0.apk
          tag_name: v1.0.0
          name: "DeepSeek Pocket App v1.0.0"
          body: |
            ### 📱 DeepSeek Pocket 专属移动端客户端 (APK 直装包)

            👇 **点击下方 Assets 里的 `DeepSeek-Pocket-v1.0.0.apk` 即可直接下载安装到手机**。

            #### ✨ 修复与优化 (v1.0.0 稳定版)
            - 🚀 **彻底解决黑屏问题**：采用顶级原生 WebView 引擎替代受限的 Iframe，支持局域网明文 `http://` 与公网 `https://` 混合通信。
            - 🌐 **原生 WebSocket 与会话保持**：全量支持 DSH `/api/events.host` 流式实时推送与 8 位密码 Cookie 保持。
            - 🎨 **DeepSeek 手机版原生 UI**：气泡对话、已深度思考折叠胶囊、浮动输入框。
            - ⚙️ **悬浮球 & 原生返回键**：随时点击右下角悬浮球或手机系统返回键快速回到连接中心。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
